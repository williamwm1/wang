<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>提货管理系统 / Pickup Management</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <!-- Login -->
  <div id="login-screen" class="login-screen hidden">
    <form id="login-form" class="login-card">
      <h1 id="login-title">提货管理系统</h1>
      <div class="field">
        <label data-i18n="email">邮箱</label>
        <input type="email" id="login-email" autocomplete="username" required />
      </div>
      <div class="field">
        <label data-i18n="password">密码</label>
        <input type="password" id="login-password" autocomplete="current-password" required />
      </div>
      <div id="login-error" class="form-error"></div>
      <button type="submit" id="login-btn" class="btn btn-primary btn-block" data-i18n="login">登录</button>
      <button type="button" id="login-lang" class="btn-link"></button>
    </form>
  </div>

  <!-- App -->
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand" data-i18n="app_title">提货管理系统</div>
      <nav class="tabs">
        <button class="tab" data-tab="invoices" data-i18n="tab_invoices"></button>
        <button class="tab" data-tab="inventory" data-i18n="tab_inventory"></button>
        <button class="tab" data-tab="returns" data-i18n="tab_returns"></button>
        <button class="tab" data-tab="activity" data-i18n="tab_activity"></button>
        <button class="tab admin-only" data-tab="users" data-i18n="tab_users"></button>
      </nav>
      <div class="topbar-right">
        <span id="presence" class="presence"></span>
        <span id="current-user" class="current-user"></span>
        <button id="lang-btn" class="btn-link"></button>
        <button id="logout-btn" class="btn-link" data-i18n="logout"></button>
      </div>
    </header>

    <div id="square-banner" class="banner hidden"></div>
    <main id="view" class="view"></main>
  </div>

  <!-- Modal host -->
  <div id="modal-root"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/signature.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
